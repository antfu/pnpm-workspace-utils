cleanupUnusedCatalogs: true
catalogMode: prefer
trustPolicy: no-downgrade
ignoreWorkspaceRootCheck: true
shellEmulator: true

packages:
  - packages/*

catalogs:
  dev:
    '@antfu/eslint-config': ^9.2.0
    '@antfu/ni': ^30.2.0
    '@antfu/utils': ^9.3.0
    '@types/node': ^25.9.5
    '@typescript-eslint/parser': ^8.65.0
    '@typescript-eslint/utils': ^8.65.0
    '@typescript/native-preview': 7.0.0-dev.20260118.1
    bumpp: ^12.0.0
    eslint: ^10.7.0
    eslint-plugin-format: ^2.0.1
    eslint-vitest-rule-tester: ^3.1.0
    jiti: ^2.7.0
    lint-staged: ^17.1.0
    simple-git-hooks: ^2.13.1
    tsdown: ^0.22.12
    tsx: ^4.23.1
    typescript: ^6.0.3
    vite: ^8.1.5
  prod:
    empathic: ^2.0.1
    eslint-json-compat-utils: ^0.2.3
    jsonc-eslint-parser: ^3.1.0
    pathe: ^2.0.3
    tinyglobby: ^0.2.17
    yaml: ^2.9.0
    yaml-eslint-parser: ^2.1.0
  test:
    '@eslint/json': ^2.0.1
    tinyexec: ^1.2.4
    vitest: ^4.1.10
    vitest-package-exports: ^1.2.0

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

minimumReleaseAgeExclude:
  - '@types/node@25.9.1'
  - tsx@4.22.3
  - '@antfu/eslint-config@9.2.0'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

overrides:
  eslint-plugin-pnpm: 'workspace:*'
